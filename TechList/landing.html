<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TECH LIST — учёт компьютерной техники</title>
  <link rel="stylesheet" href="css/landing.css">
  <script src="js/landing.js" defer></script>
</head>
<body>
<main class="page">
  <header class="top">
    <div class="topbar">
      <div class="logo">TECH LIST</div>
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <div class="intro">
      <h1>СИСТЕМА УЧЁТА КОМПЬЮТЕРНОЙ ТЕХНИКИ</h1>
      <div class="intro-rule"></div>
      <p>Контролируй знания рабочих инструментов<br>эффективно!</p>
    </div>
  </header>

  <section class="features">
    <div class="feature-grid">
      <div class="feature-card"></div>
      <div class="feature-card"></div>
    </div>
    <div class="pill-title">ВОЗМОЖНОСТИ СИСТЕМЫ</div>
  </section>

  <section class="slider" id="slider">
    <div class="slides" id="slides">
      <div class="slide">СЛАЙД 1</div>
      <div class="slide">СЛАЙД 2</div>
      <div class="slide">СЛАЙД 3</div>
    </div>
    <button class="slider-btn prev" id="prevBtn" aria-label="Предыдущий слайд">‹</button>
    <button class="slider-btn next" id="nextBtn" aria-label="Следующий слайд">›</button>
    <div class="slider-dots" id="dots">
      <span class="active" data-index="0"></span>
      <span data-index="1"></span>
      <span data-index="2"></span>
    </div>
  </section>

  <section class="benefits">
    <div class="benefit-panel">
      <div class="benefit-title">ПРЕИМУЩЕСТВА НАШЕЙ СИСТЕМЫ</div>
    </div>
  </section>

  <section class="content">
    <div class="wide-card"></div>
    <div class="bottom-grid">
      <div class="bottom-card"></div>
      <div class="bottom-card"></div>
    </div>
  </section>
  <footer class="footer"></footer>
</main>
</body>
</html>
